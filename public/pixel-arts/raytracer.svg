<svg
  xmlns="http://www.w3.org/2000/svg"
  version="1.1"
  viewBox="0 0 800 800"
  preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern
      id="raytracer-pattern"
      width="20"
      height="20"
      patternUnits="userSpaceOnUse"
      patternTransform="scale(40)"
      shape-rendering="crispEdges">
      <g fill="currentColor">
        <!-- Incoming ray and its reflection -->
        <rect x="1" y="5" width="6" height="1" />
        <rect x="2" y="6" width="5" height="1" />
        <rect x="3" y="7" width="4" height="1" />
        <rect x="4" y="8" width="3" height="1" />
        <rect x="3" y="3" width="1" height="1" />
        <rect x="2" y="2" width="1" height="1" />

        <!-- Reflective sphere -->
        <rect x="9" y="3" width="5" height="1" />
        <rect x="7" y="4" width="2" height="1" />
        <rect x="14" y="4" width="2" height="1" />
        <rect x="6" y="5" width="1" height="2" />
        <rect x="16" y="5" width="1" height="2" />
        <rect x="5" y="7" width="1" height="5" />
        <rect x="17" y="7" width="1" height="5" />
        <rect x="6" y="12" width="1" height="2" />
        <rect x="16" y="12" width="1" height="2" />
        <rect x="7" y="14" width="2" height="1" />
        <rect x="14" y="14" width="2" height="1" />
        <rect x="9" y="15" width="5" height="1" />

        <!-- Refraction through the sphere -->
        <rect x="7" y="9" width="2" height="1" />
        <rect x="9" y="10" width="3" height="1" />
        <rect x="12" y="11" width="3" height="1" />
        <rect x="15" y="12" width="2" height="1" />

        <!-- Ground and cast shadow -->
        <rect x="2" y="17" width="16" height="1" />
        <rect x="8" y="16" width="8" height="1" />
        <rect x="11" y="18" width="6" height="1" />
      </g>

      <!-- Specular highlight -->
      <g fill="hsl(0, 0%, 90%)">
        <rect x="8" y="6" width="2" height="1" />
        <rect x="7" y="7" width="2" height="2" />
        <rect x="9" y="7" width="1" height="1" />
      </g>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#raytracer-pattern)" />
</svg>
