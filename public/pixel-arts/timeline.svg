<svg
  xmlns="http://www.w3.org/2000/svg"
  version="1.1"
  viewBox="0 0 800 800"
  preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern
      id="pppixelate-pattern"
      width="20"
      height="20"
      patternUnits="userSpaceOnUse"
      patternTransform="scale(40)"
      shape-rendering="crispEdges">
      <g fill="currentColor">
        <rect x="2" y="9" width="2" height="2" />
        <rect x="4" y="9" width="3" height="1" />
        <rect x="7" y="7" width="3" height="3" />
        <rect x="10" y="9" width="3" height="1" />
        <rect x="13" y="9" width="3" height="3" />
        <rect x="16" y="9" width="2" height="1" />

        <rect x="3" y="5" width="1" height="4" />
        <rect x="2" y="4" width="3" height="2" />

        <rect x="8" y="4" width="1" height="3" />
        <rect x="7" y="2" width="3" height="2" />

        <rect x="14" y="12" width="1" height="3" />
        <rect x="13" y="15" width="3" height="2" />

        <rect x="3" y="12" width="1" height="2" />
        <rect x="3" y="15" width="1" height="2" />
        <rect x="6" y="12" width="1" height="5" />
        <rect x="9" y="12" width="1" height="2" />
        <rect x="9" y="15" width="1" height="2" />
      </g>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#pppixelate-pattern)" />
</svg>
