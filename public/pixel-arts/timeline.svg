<svg
  xmlns="http://www.w3.org/2000/svg"
  version="1.1"
  viewBox="0 0 800 800"
  preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern
      id="timeline-pattern"
      width="20"
      height="20"
      patternUnits="userSpaceOnUse"
      patternTransform="scale(40)"
      shape-rendering="crispEdges">
      <g fill="currentColor">
        <rect x="4" y="2" width="1" height="16" />

        <rect x="3" y="3" width="3" height="3" />
        <rect x="8" y="3" width="9" height="1" />
        <rect x="8" y="5" width="6" height="1" />

        <rect x="3" y="9" width="3" height="3" />
        <rect x="8" y="9" width="8" height="1" />
        <rect x="8" y="11" width="5" height="1" />

        <rect x="3" y="15" width="3" height="3" />
        <rect x="8" y="15" width="9" height="1" />
        <rect x="8" y="17" width="7" height="1" />
      </g>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#timeline-pattern)" />
</svg>
